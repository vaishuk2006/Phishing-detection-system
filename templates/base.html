
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PhishGuard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('index') }}" class="brand">🛡️ Phish<span class="accent">Guard</span></a>
        <nav class="nav-links">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('index') }}">Scan URL</a>
            <a href="{{ url_for('about_model') }}">About Model</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>🛡️ PhishGuard — Student Cybersecurity Project</p>
        <p>URL analysis demonstration | Stay alert. Stay secure.</p>
    </footer>
</body>
</html>
